<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiant HQM | Staging</title><style>body{font:16px system-ui;background:#f1f5f9;color:#17324d;margin:0}header{background:#17324d;color:white;padding:24px}main{max-width:1100px;margin:24px auto;padding:16px}section{background:white;padding:24px;border:1px solid #d6e0e9;border-radius:12px;margin-bottom:16px}input,button,select{font:inherit;padding:12px;border:1px solid #9aabba;border-radius:6px;margin:5px;max-width:90%}button{background:#174b72;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left} .scroll{overflow:auto}small{color:#52677a} [hidden]{display:none!important}</style><header><strong>RADIANT GROUP | HQM</strong><div>V2.9.23 · Staging connectivity test · Bukan production</div></header><main><section id="login"><h2>Masuk</h2><form id="form"><input id="username" placeholder="Username" autocomplete="username" required><input id="email" type="email" placeholder="Email Auth (uji awal)" autocomplete="email" required><input id="password" type="password" placeholder="Password Supabase" autocomplete="current-password" required><button>Masuk</button></form><small>Hanya akun Admin yang sudah diaktifkan. Password tidak disimpan.</small></section><p id="status" role="status"></p><section id="panel" hidden><h2 id="identity"></h2><button id="refresh">Sinkronkan ulang</button><button id="logout">Keluar</button><select id="module"><option value="personnel">Personel</option><option value="monthly_metric">KPI bulanan</option><option value="activity">Aktivitas</option><option value="approval">Approval</option><option value="calendar">Kalender</option><option value="swot">SWOT</option><option value="audit">Audit</option></select><div class="scroll" id="data"></div></section></main><script>
'use strict';const base='https://xjpqojnjlgkyxrlwnmxq.supabase.co',key='sb_publishable_XRMtRQCtDfs08cuKIeN48A_h2ViMHrH';const $=id=>document.getElementById(id);let token='',me=null;const say=s=>$('status').textContent=s;async function req(path,opts={}){const r=await fetch(base+path,{...opts,headers:{apikey:key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...opts.headers}});if(!r.ok)throw Error('Server menolak permintaan ('+r.status+').');return r.status===204?null:r.json()}
$('form').onsubmit=async e=>{e.preventDefault();say('Menghubungkan...');try{if($('username').value.trim().toLowerCase()!=='r8k4m2qa')throw Error('Akun staging belum diaktifkan.');const a=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=a.access_token;const p=await req('/rest/v1/hqm_personnel?select=id,name,role,username,active&auth_id=eq.'+encodeURIComponent(a.user.id));me=p.find(x=>x.active&&x.username===$('username').value.trim().toLowerCase());if(!me)throw Error('Personel tidak aktif.');$('identity').textContent=me.name+' · '+me.role;$('login').hidden=true;$('panel').hidden=false;await load()}catch(e){token='';me=null;say(e.message)}finally{$('password').value=''}};
async function load(){try{const t=$('module').value;const rows=await req('/rest/v1/hqm_'+t+'?select=*&limit=100');const box=$('data');box.replaceChildren();if(!rows.length){box.textContent='Belum ada data.';say('Sinkronisasi berhasil.');return}const keys=Object.keys(rows[0]).filter(k=>!['auth_id','id','manager_id','person_id','submitted_by'].includes(k));const table=document.createElement('table');const head=table.insertRow();for(const k of keys){const th=document.createElement('th');th.textContent=k;head.append(th)}for(const r of rows){const tr=table.insertRow();for(const k of keys)tr.insertCell().textContent=typeof r[k]==='object'?JSON.stringify(r[k]):String(r[k]??'');}box.append(table);say('Sinkronisasi berhasil · '+rows.length+' record (maksimum 100).')}catch(e){say(e.message)}}
$('refresh').onclick=load;$('module').onchange=load;$('logout').onclick=async()=>{try{await req('/auth/v1/logout',{method:'POST'})}catch(e){}finally{token='';me=null;$('panel').hidden=true;$('login').hidden=false;$('data').replaceChildren();say('Sesi lokal ditutup.')}};
</script></html>
