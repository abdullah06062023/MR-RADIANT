<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiant HQM | Staging</title><style>body{font:16px system-ui;background:#f1f5f9;color:#17324d;margin:0}header{background:#17324d;color:white;padding:24px}main{max-width:1100px;margin:24px auto;padding:16px}section{background:white;padding:24px;border:1px solid #d6e0e9;border-radius:12px;margin-bottom:16px}input,button,select{font:inherit;padding:12px;border:1px solid #9aabba;border-radius:6px;margin:5px;max-width:90%}button{background:#174b72;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left} .scroll{overflow:auto}small{color:#52677a} [hidden]{display:none!important}</style><header><strong>RADIANT GROUP | HQM</strong><div>V2.9.23 · Staging RC4 · Cloud workspace · Bukan production</div></header><main><p><a href="demo.html" target="_blank" rel="noopener">Buka dashboard lengkap DEMO V2.9.22 (data lokal terpisah)</a></p><section id="login"><h2>Masuk</h2><form id="form"><input id="username" placeholder="Username" autocomplete="username" required><input id="email" type="email" placeholder="Email Auth (uji awal)" autocomplete="email" required><input id="password" type="password" placeholder="Password Supabase" autocomplete="current-password" required><button>Masuk</button></form><small>Hanya akun Admin yang sudah diaktifkan. Password tidak disimpan.</small></section><p id="status" role="status"></p><section id="panel" hidden><h2 id="identity"></h2><button id="refresh">Sinkronkan ulang</button><button id="logout">Keluar</button><select id="module"><option value="personnel">Personel</option><option value="monthly_metric">KPI bulanan</option><option value="activity">Aktivitas</option><option value="approval">Approval</option><option value="calendar">Kalender</option><option value="swot">SWOT</option><option value="audit">Audit</option></select><button id="export">Export CSV</button><div id="summary"></div><div id="kpi"></div><div id="editor"></div><div class="scroll" id="data"></div></section></main><script>
'use strict';const base='https://xjpqojnjlgkyxrlwnmxq.supabase.co',key='sb_publishable_XRMtRQCtDfs08cuKIeN48A_h2ViMHrH';const $=id=>document.getElementById(id);let signing=false, token='',me=null, displayed=[], peopleMap=new Map(), roleMap=new Map(), loading=false;const say=s=>$('status').textContent=s;async function req(path,opts={}){const r=await fetch(base+path,{signal:AbortSignal.timeout(20000),...opts,headers:{apikey:key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...opts.headers}});if(!r.ok)throw Error('Server menolak permintaan ('+r.status+').');const body=await r.text();return body?JSON.parse(body):null}
$('form').onsubmit=async e=>{e.preventDefault();if(signing)return;signing=true;$('form').querySelector('button').disabled=true;say('Menghubungkan...');try{const a=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=a.access_token;const p=await req('/rest/v1/hqm_personnel?select=id,name,role,username,active&auth_id=eq.'+encodeURIComponent(a.user.id));me=p.find(x=>x.active&&x.username===$('username').value.trim().toLowerCase());if(!me)throw Error('Personel tidak aktif.');$('identity').textContent=me.name+' · '+me.role;$('login').hidden=true;$('panel').hidden=false;await load()}catch(e){token='';me=null;say(e.message)}finally{$('password').value='';signing=false;$('form').querySelector('button').disabled=false}};
async function load(){if(loading)return false;loading=true; $('module').disabled=true; $('logout').disabled=true; $('refresh').disabled=true; $('export').disabled=true; displayed=[]; $('summary').replaceChildren(); $('kpi').replaceChildren(); $('data').replaceChildren(); try{const t=$('module').value; const people=await req('/rest/v1/hqm_personnel?select=id,code,name,role&limit=1000'); roleMap=new Map(people.map(p=>[p.id,p.role])); peopleMap=new Map(people.map(p=>[p.id,p.code+' — '+p.name])); const rows=[]; for(let offset=0;;offset+=100){const page=await req('/rest/v1/hqm_'+t+'?select=*&order='+ (t==='monthly_metric'?'person_id,month,metric':'id') +'&limit=100&offset='+offset); rows.push(...page); if(page.length<100)break; if(offset>=9900)throw Error('Batas 10.000 record; laporan perlu filter periode.');} displayed=rows.map(r=>{const x={...r}; if(r.person_id)x.personel=peopleMap.get(r.person_id)||'Tidak tersedia'; if(r.submitted_by)x.pengaju=peopleMap.get(r.submitted_by)||'Tidak tersedia'; for(const k of ['auth_id','id','manager_id','person_id','submitted_by'])delete x[k]; if(t==='monthly_metric')x.achievement_pct=r.actual==null||Number(r.target)<=0?null:Math.round(Number(r.actual)/Number(r.target)*10000)/100; return x}); if(t==='monthly_metric'){$('summary').textContent='Pencapaian per parameter = realisasi / target × 100%. Skor FF terpisah menggunakan bobot standar 40/25/15/10/10, cap 120% per parameter. Data aktivitas harian belum otomatis direkonsiliasi.';renderKpi(rows);} $('export').disabled=!rows.length;await editor(t,rows);const box=$('data');box.replaceChildren();if(!rows.length){box.textContent='Belum ada data.';say('Sinkronisasi berhasil.');return true}const keys=Object.keys(displayed[0]);const table=document.createElement('table');const head=table.insertRow();for(const k of keys){const th=document.createElement('th');th.textContent=k;head.append(th)}for(const r of displayed){const tr=table.insertRow();for(const k of keys)tr.insertCell().textContent=typeof r[k]==='object'?JSON.stringify(r[k]):String(r[k]??'');}box.append(table);say('Sinkronisasi berhasil · '+rows.length+' record.');return true}catch(e){displayed=[]; $('export').disabled=true; $('editor').replaceChildren(); say(e.message);return false}finally{loading=false; $('module').disabled=false; $('logout').disabled=false; $('refresh').disabled=false}}
async function editor(t,rows){const el=$('editor');el.replaceChildren();const admin=me.role==='ADMIN',ff=me.role==='FF',spv=me.role==='SPV';const people=await req('/rest/v1/hqm_personnel?select=id,name,role&limit=100');const field=(label,values,type='text')=>{const l=document.createElement('label');l.textContent=label+' ';const x=document.createElement(values?'select':'input');if(values){for(const [v,n] of values){const o=document.createElement('option');o.value=v;o.textContent=n;x.append(o)}}else{x.type=type;x.required=true}l.append(x);el.append(l);return x};const person=()=>field('Personel',people.filter(p=>p.role==='FF'&&(admin||spv||p.id===me.id)).map(p=>[p.id,p.name]));const button=(name,fn)=>{const b=document.createElement('button');b.textContent=name;b.onclick=async()=>{b.disabled=true;try{await fn();const synced=await load();say(synced?'Perubahan tersimpan di server.':'Perubahan tersimpan, tetapi pembacaan ulang gagal. Jangan ulangi input sebelum sinkronisasi.')}catch(e){say(e.message)}finally{b.disabled=false}};el.append(b)};const write=(table,method,body,query='')=>req('/rest/v1/hqm_'+table+query,{method,headers:{Prefer:'return=representation'},body:JSON.stringify(body)}).then(r=>{if(!Array.isArray(r)||!r.length)throw Error('Tidak ada record yang berubah.');return r});const num=x=>{if(!x.value||!Number.isFinite(+x.value)||+x.value<0)throw Error('Nilai tidak valid');return +x.value};const month=x=>{if(!x.value)throw Error('Pilih bulan');return x.value+'-01'};if(t==='activity'&&(admin||ff)){const p=person(),d=field('Tanggal',null,'date'),k=field('Jenis',['sales','visit','ec','noo','entertainment'].map(x=>[x,x])),a=field('Jumlah',null,'number'),note=field('Catatan');note.required=false;button('Tambah aktivitas',()=>{if(!p.value||!d.value)throw Error('Personel dan tanggal wajib');return write(t,'POST',{person_id:p.value,activity_date:d.value,kind:k.value,amount:num(a),details:{note:note.value}})});if(rows.length){const r=field('Edit record',rows.map(x=>[x.id,x.activity_date+' '+x.kind+' '+x.amount]));button('Ubah jumlah record',()=>write(t,'PATCH',{amount:num(a)},'?id=eq.'+r.value))}}if(t==='monthly_metric'&&admin){const p=person(),m=field('Bulan',null,'month'),k=field('Parameter',['RSN','NN','Vitashopindo','visit','ec','noo','expense','close','entClosing'].map(x=>[x,x])),a=field('Target',null,'number');button('Simpan target',async()=>{const body={person_id:p.value,month:month(m),metric:k.value,target:num(a)};const r=await req('/rest/v1/hqm_monthly_metric?on_conflict=person_id,month,metric',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});if(!r?.length)throw Error('Target tidak tersimpan')})}if(t==='approval'&&spv){const p=person(),m=field('Bulan',null,'month'),k=field('Jenis',[['target','Target'],['realization','Realisasi']]),metric=field('Parameter',['RSN','NN','Vitashopindo','noo','expense','visit','ec','close','entClosing'].map(x=>[x,x])),a=field('Nilai',null,'number');button('Ajukan',()=>write(t,'POST',{person_id:p.value,submitted_by:me.id,month:month(m),kind:k.value,payload:{[metric.value]:num(a)}}))}if(t==='approval'&&admin&&rows.some(x=>x.status==='pending')){const r=field('Pengajuan pending',rows.filter(x=>x.status==='pending').map(x=>[x.id,x.month+' '+x.kind+' '+JSON.stringify(x.payload)]));for(const status of ['approved','rejected'])button(status==='approved'?'Setujui':'Tolak',()=>write(t,'PATCH',{status},'?id=eq.'+r.value+'&status=eq.pending'))}if(t==='calendar'&&admin){const p=person(),d=field('Tanggal',null,'date'),k=field('Jenis',['holiday','sick','permission'].map(x=>[x,x]));button('Tambah kalender',()=>write(t,'POST',{person_id:p.value,day:d.value,kind:k.value}))}if(t==='swot'){const m=field('Bulan',null,'month'),fields=['strength','weakness','opportunity','threat'].map(x=>[x,field(x)]);button('Simpan SWOT sendiri',()=>write(t,'POST',{person_id:me.id,month:month(m),content:Object.fromEntries(fields.map(([k,x])=>[k,x.value]))}))}}
function ffScore(group){const m=new Map(group.map(r=>[r.metric,r]));const val=(k,f)=>{const x=m.get(k);return x&&x[f]!=null&&Number.isFinite(Number(x[f]))&&Number(x[f])>=0?Number(x[f]):null};const ratio=(a,t)=>a===null||t===null||t<=0?null:100*a/t;const sum=(ks,f)=>{const a=ks.map(k=>val(k,f));return a.includes(null)?null:a.reduce((s,x)=>s+x,0)};const cats=['RSN','NN','Vitashopindo'];const conversion=(f)=>ratio(val('close',f),val('visit',f));const values=[ratio(sum(cats,'actual'),sum(cats,'target')),ratio(val('visit','actual'),val('visit','target')),ratio(val('noo','actual'),val('noo','target')),ratio(conversion('actual'),conversion('target')),ratio(val('entClosing','actual'),val('entClosing','target'))];return {values,score:values.includes(null)?null:values.reduce((s,v,i)=>s+Math.min(120,v)*[.4,.25,.15,.1,.1][i],0)}}
function renderKpi(rows){const box=$('kpi');box.replaceChildren();const groups=new Map();for(const r of rows){const k=r.person_id+'|'+r.month;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}for(const group of groups.values()){const h=document.createElement('h3');h.textContent=(peopleMap.get(group[0].person_id)||'Personel')+' · '+group[0].month;box.append(h);if(roleMap.get(group[0].person_id)==='FF'){const result=ffScore(group);const score=document.createElement('p');score.textContent='KPI FF berbobot (realisasi bulanan, bobot standar): '+(result.score===null?'Data belum lengkap':result.score.toFixed(2)+'%');box.append(score);const labels=['Sales','Visit','NOO','Conversion','Entertainment closing'];const detail=document.createElement('p');detail.textContent=labels.map((l,i)=>l+': '+(result.values[i]===null?'—':result.values[i].toFixed(1)+'%')).join(' | ');box.append(detail);}for(const r of group){const line=document.createElement('div');const pct=r.actual==null||Number(r.target)<=0?null:100*Number(r.actual)/Number(r.target);line.textContent=r.metric+' — '+(pct===null?'Data belum lengkap':pct.toFixed(1)+'%');if(pct!==null){const bar=document.createElement('progress');bar.max=120;bar.value=Math.max(0,Math.min(120,pct));bar.style.margin='0 12px';line.append(bar)}box.append(line)}}}
function csvCell(v){let s=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
$('export').onclick=()=>{if(!me||!displayed.length)return;const keys=Object.keys(displayed[0]);const csv=[keys.map(csvCell).join(','),...displayed.map(r=>keys.map(k=>csvCell(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='HQM-'+$('module').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('refresh').onclick=load;$('module').onchange=load;$('logout').onclick=async()=>{try{await req('/auth/v1/logout',{method:'POST'})}catch(e){}finally{token='';me=null;displayed=[];$('summary').replaceChildren();$('kpi').replaceChildren();peopleMap.clear();$('identity').textContent='';$('panel').hidden=true;$('login').hidden=false;$('data').replaceChildren();$('editor').replaceChildren();say('Sesi lokal ditutup.')}};
